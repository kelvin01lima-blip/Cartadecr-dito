<!DOCTYPE html>
<html lang="pt-BR">
<head>
    <meta charset="UTF-8">
    <title>S.O.S Soluções - Clube S.O.S Carta de Crédito</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <style>body { font-family: sans-serif; }</style>
</head>
<body class="bg-slate-100 min-h-screen">

    <header class="bg-[#0f172a] text-white p-6 border-b-4 border-[#f97316]">
        <div class="max-w-7xl mx-auto flex justify-between items-center">
            <div>
                <h1 class="text-2xl font-bold tracking-wide">S.O.S SOLUÇÕES</h1>
                <p class="text-[10px] text-[#f97316] uppercase font-bold tracking-widest mt-1">Clube S.O.S Carta de Crédito</p>
            </div>
            <div id="statusArea" class="hidden flex items-center gap-4">
                <span id="labelUser" class="text-xs font-bold uppercase text-slate-300"></span>
                <button onclick="logout()" class="bg-red-600 px-4 py-2 rounded-lg text-[10px] font-bold uppercase">Sair</button>
            </div>
        </div>
    </header>

    <main class="max-w-7xl mx-auto p-6 space-y-6">
        <div id="boxLogin" class="bg-white p-8 rounded-2xl shadow-sm border border-slate-200 max-w-sm mx-auto mt-10">
            <h2 class="font-bold text-lg mb-4">Acesso ao Clube</h2>
            <select id="selectLogin" class="w-full p-3 mb-4 bg-slate-50 border rounded-xl font-bold"></select>
            <input type="password" id="inputSenha" placeholder="Senha" class="w-full p-3 mb-4 bg-slate-50 border rounded-xl">
            <button onclick="fazerLogin()" class="w-full bg-[#0f172a] hover:bg-slate-800 text-white p-3 rounded-xl font-bold transition">ENTRAR</button>
        </div>

        <div id="boxApp" class="hidden space-y-6">
            <button onclick="toggleModal('modalRegras')" class="bg-[#f97316] text-white px-4 py-2 rounded-lg text-xs font-bold shadow-md">❓ COMO FUNCIONA / REGRAS</button>

            <div id="viewCliente" class="hidden space-y-6">
                <div class="bg-slate-900 p-8 rounded-2xl text-white">
                    <h2 class="text-2xl font-bold">Parceria Estratégica: <span id="cliNome"></span></h2>
                    <p class="text-slate-300 text-sm mt-2">Sua marca é um pilar da S.O.S. Seu aporte fortalece nosso fluxo de caixa e garante descontos exclusivos na sua margem.</p>
                </div>
                <div id="totaisCliente" class="grid grid-cols-3 gap-4 font-bold"></div>
                <div id="historicoDisplay" class="bg-white p-6 rounded-2xl border space-y-2"></div>
            </div>

            <div id="viewDiretoria" class="bg-white p-6 rounded-2xl border hidden space-y-4">
                <h2 class="font-bold text-lg">Painel Diretoria</h2>
                <table class="w-full text-left">
                    <thead class="text-xs uppercase text-slate-400"><tr><th class="p-3">Marca</th><th class="p-3">Saldo</th><th class="p-3">Ações</th></tr></thead>
                    <tbody id="tabelaDiretoria"></tbody>
                </table>
            </div>
        </div>
    </main>

    <!-- MODAL REGRAS -->
    <div id="modalRegras" class="fixed inset-0 bg-black/50 hidden flex items-center justify-center p-4">
        <div class="bg-white p-8 rounded-2xl max-w-lg w-full space-y-4">
            <h2 class="font-bold text-lg border-b pb-2">Como funciona o S.O.S Clube</h2>
            <div id="conteudoRegras" class="text-sm text-slate-600"></div>
            <button onclick="toggleModal('modalRegras')" class="w-full bg-[#0f172a] text-white p-3 rounded-lg">Entendido</button>
        </div>
    </div>

    <!-- MODAL EDICAO -->
    <div id="modalEdit" class="fixed inset-0 bg-black/50 hidden flex items-center justify-center p-4">
        <div class="bg-white p-8 rounded-2xl max-w-sm w-full space-y-4">
            <h2 class="font-bold text-lg">Editar Parceiro</h2>
            <input id="eAporte" type="number" class="w-full p-3 bg-slate-50 border rounded-xl" placeholder="Aporte">
            <input id="eAbatido" type="number" class="w-full p-3 bg-slate-50 border rounded-xl" placeholder="Abatido">
            <input id="eNovoHist" class="w-full p-3 bg-slate-50 border rounded-xl" placeholder="Data: Descrição Movimento">
            <button onclick="salvarEdit()" class="w-full bg-[#f97316] text-white p-4 rounded-xl font-bold">SALVAR</button>
        </div>
    </div>

    <script>
        let data = JSON.parse(localStorage.getItem('sos_data')) || {
            clientes: [
                { nome: 'Diretoria', senha: '123456', isAdm: true },
                { nome: 'Uli Joias', senha: '987654321', aporte: 0, abatido: 0, hist: [] },
                { nome: 'Niara Joias', senha: '123456789', aporte: 3623.13, abatido: 0, hist: ['01/08/2026: Aporte R$ 3623,13'] }
            ]
        };

        function atualizarSelect() {
            const s = document.getElementById('selectLogin');
            s.innerHTML = data.clientes.map(c => `<option value="${c.nome}">${c.nome}</option>`).join('');
        }
        atualizarSelect();

        function fazerLogin() {
            const c = data.clientes.find(x => x.nome === document.getElementById('selectLogin').value && x.senha === document.getElementById('inputSenha').value);
            if(c) { sessionStorage.setItem('u', JSON.stringify(c)); location.reload(); }
            else alert('Senha incorreta!');
        }

        function logout() { sessionStorage.removeItem('u'); location.reload(); }
        function toggleModal(id) { document.getElementById(id).classList.toggle('hidden'); }

        const u = JSON.parse(sessionStorage.getItem('u'));
        if(u) {
            document.getElementById('boxLogin').classList.add('hidden');
            document.getElementById('boxApp').classList.remove('hidden');
            document.getElementById('statusArea').classList.remove('hidden');
            document.getElementById('labelUser').innerText = u.nome;
            if(u.isAdm) {
                document.getElementById('viewDiretoria').classList.remove('hidden');
                document.getElementById('tabelaDiretoria').innerHTML = data.clientes.filter(x=>!x.isAdm).map((c,i) => `<tr><td class="p-3 font-bold">${c.nome}</td><td class="p-3">R$ ${c.aporte-c.abatido}</td><td class="p-3"><button onclick="abrirEdit(${i})" class="text-orange-500 font-bold">EDITAR</button></td></tr>`).join('');
            } else {
                document.getElementById('viewCliente').classList.remove('hidden');
                document.getElementById('cliNome').innerText = u.nome;
                document.getElementById('totaisCliente').innerHTML = `<div>Aporte: R$ ${u.aporte}</div><div>Abatido: R$ ${u.abatido}</div><div>Saldo: R$ ${u.aporte-u.abatido}</div>`;
                document.getElementById('historicoDisplay').innerHTML = u.hist.map(h => `<p class="border-b py-2">${h}</p>`).join('');
            }
        }

        function abrirEdit(i) {
            window.idx = i;
            let c = data.clientes.filter(x=>!x.isAdm)[i];
            document.getElementById('eAporte').value = c.aporte;
            document.getElementById('eAbatido').value = c.abatido;
            toggleModal('modalEdit');
        }

        function salvarEdit() {
            let c = data.clientes.filter(x=>!x.isAdm)[window.idx];
            c.aporte = parseFloat(document.getElementById('eAporte').value);
            c.abatido = parseFloat(document.getElementById('eAbatido').value);
            let hist = document.getElementById('eNovoHist').value;
            if(hist) c.hist.push(hist);
            localStorage.setItem('sos_data', JSON.stringify(data));
            location.reload();
        }

        function abrirRegras() {
            const isNiara = u && u.nome === 'Niara Joias';
            document.getElementById('conteudoRegras').innerHTML = isNiara ? "Niara: 30% até 8.9k, 35% acima de 9k. Prazo 10 dias." : "Padrão: 10% a 30%. Prazo 10 dias.";
            toggleModal('modalRegras');
        }
    </script>
</body>
</html>
